<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSU PWD | Inquiries & Messages</title>

  <link rel="icon" type="image/png" sizes="32x32" href="https://wxyzofficial.sirv.com/canteen/ssu.jpg">
  <link rel="shortcut icon" href="https://wxyzofficial.sirv.com/canteen/ssu.jpg">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Fonts - Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0a4b7a;
      --primary-light: #1e6a9f;
      --primary-dark: #063558;
      --accent: #f9b81b;
      --accent-dark: #e5a800;
      --success: #10b981;
      --danger: #dc2626;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
      --shadow-xl: 0 20px 48px rgba(0,0,0,0.16);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f0f7ff 0%, #e8f2ff 50%, #f5f8fc 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--gray-800);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

    .page-container { max-width: 1440px; margin: 0 auto; padding: 1.5rem; }

    /* HEADER */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 1.1rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .logo-area { display: flex; align-items: center; gap: 1rem; }

    .logo-area img {
      width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
      box-shadow: var(--shadow-sm); border: 2px solid white;
    }

    .logo-area strong { color: var(--primary); font-size: 1.05rem; font-weight: 700; display: block; }
    .logo-area small { color: var(--gray-500); font-size: 0.78rem; font-weight: 500; }

    .nav-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* BUTTONS */
    .btn {
      padding: 10px 20px; border: none; border-radius: 48px; cursor: pointer;
      font-weight: 600; transition: var(--transition);
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.85rem; font-family: inherit;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; box-shadow: 0 4px 12px rgba(10, 75, 122, 0.25);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10, 75, 122, 0.35); }

    .btn-outline { background: transparent; border: 1.5px solid var(--gray-300); color: var(--gray-700); }
    .btn-outline:hover { background: var(--gray-50); border-color: var(--primary); color: var(--primary); }

    .btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; }
    .btn-danger:hover { transform: translateY(-2px); }

    .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); }

    .btn-warning { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: var(--gray-900); }
    .btn-warning:hover { transform: translateY(-2px); }

    .btn-sm { padding: 6px 14px; font-size: 0.78rem; gap: 5px; }

    /* BACK LINK */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 1.2rem;
      padding: 8px 16px;
      border-radius: 40px;
      transition: var(--transition);
      font-size: 0.88rem;
    }

    .back-link:hover { background: rgba(10, 75, 122, 0.08); transform: translateX(-3px); }

    /* CARD */
    .card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-100);
    }

    .card h3 {
      color: var(--primary);
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .card h3 i {
      color: var(--accent);
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff8e1, #ffefc2);
      border-radius: 12px;
      flex-shrink: 0;
    }

    /* TABS */
    .tab-container {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      background: var(--gray-100);
      padding: 6px;
      border-radius: 48px;
      width: fit-content;
    }

    .tab-btn {
      padding: 10px 22px;
      border: none;
      border-radius: 48px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
      background: transparent;
      color: var(--gray-500);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover { color: var(--primary); }

    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .tab-btn .badge-count {
      display: inline-block;
      background: var(--gray-200);
      color: var(--gray-600);
      padding: 2px 10px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      transition: var(--transition);
    }

    .tab-btn.active .badge-count {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
    }

    /* STUDENT CARDS GRID */
    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .student-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 1.1rem 1.2rem;
      cursor: pointer;
      transition: var(--transition);
      border: 1.5px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .student-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--primary), var(--primary-light));
    }

    .student-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .student-card .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .student-card .info { flex: 1; min-width: 0; }

    .student-card .info .name {
      font-weight: 700;
      color: var(--gray-800);
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-card .info .email {
      font-size: 0.75rem;
      color: var(--gray-500);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-card .info .last-message {
      font-size: 0.72rem;
      color: var(--gray-600);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-style: italic;
    }

    .student-card .badge-unread {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 3px 10px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* INQUIRY ITEMS */
    .inquiry-item {
      background: var(--gray-50);
      padding: 16px 18px;
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
      transition: var(--transition);
      border: 1px solid var(--gray-100);
    }

    .inquiry-item:hover {
      background: white;
      box-shadow: var(--shadow-sm);
      transform: translateX(4px);
    }

    .inquiry-item .inquiry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .inquiry-item .inquiry-sender {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inquiry-item .inquiry-sender .sender-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      margin-right: 6px;
    }

    .inquiry-item .inquiry-date {
      font-size: 0.75rem;
      color: var(--gray-400);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .inquiry-item .inquiry-message {
      color: var(--gray-700);
      margin: 10px 0;
      font-size: 0.88rem;
      line-height: 1.5;
      padding-left: 40px;
    }

    .inquiry-item .inquiry-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-left: 40px;
    }

    .inquiry-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .inquiry-pending { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
    .inquiry-ongoing { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; }
    .inquiry-done { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }

    .latest-reply {
      margin-top: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border-left: 3px solid var(--success);
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      margin-left: 40px;
    }

    .latest-reply strong {
      color: var(--success);
      display: block;
      margin-bottom: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .latest-reply small { color: var(--gray-400); font-size: 0.7rem; }

    .no-results {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--gray-400);
      font-size: 0.95rem;
    }

    .no-results i {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.25s ease;
      padding: 1rem;
    }

    .modal-overlay.active { display: flex; }

    .modal-container {
      background: white;
      border-radius: var(--radius-xl);
      max-width: 620px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 1.5rem 1.8rem 1rem 1.8rem;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      z-index: 2;
    }

    .modal-header h3 {
      color: var(--primary);
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-header h3 i { color: var(--accent); }

    .modal-close {
      background: var(--gray-100);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--gray-500);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .modal-close:hover { background: #fee2e2; color: var(--danger); transform: rotate(90deg); }

    .modal-body { padding: 1.5rem 1.8rem; flex: 1; display: flex; flex-direction: column; }

    .modal-footer {
      padding: 1.2rem 1.8rem 1.5rem 1.8rem;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--gray-100);
      position: sticky;
      bottom: 0;
      background: white;
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
    }

    .modal-input, .modal-textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-family: inherit;
      transition: var(--transition);
      background: var(--gray-50);
      color: var(--gray-800);
    }

    .modal-textarea { resize: vertical; min-height: 80px; }

    .modal-input:focus, .modal-textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(10, 75, 122, 0.08);
    }

    .modal-input:disabled, .modal-textarea:disabled {
      background: var(--gray-100);
      color: var(--gray-500);
      cursor: not-allowed;
    }

    .form-group { margin-bottom: 1.2rem; }

    .form-group label {
      display: block;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .form-group label i { color: var(--primary); margin-right: 4px; }

    /* CHAT MODAL */
    .chat-modal .modal-container {
      max-width: 620px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0 16px 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .chat-header .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .chat-header .chat-user {
      font-weight: 700;
      color: var(--gray-800);
      font-size: 1rem;
    }

    .chat-header .chat-status {
      font-size: 0.75rem;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .chat-header .chat-status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      max-height: 400px;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-message {
      padding: 10px 16px;
      border-radius: 20px;
      max-width: 80%;
      font-size: 0.88rem;
      line-height: 1.5;
      animation: slideUp 0.2s ease;
    }

    .chat-message.sent {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 8px rgba(10, 75, 122, 0.2);
    }

    .chat-message.received {
      background: var(--gray-100);
      color: var(--gray-800);
      margin-right: auto;
      border-bottom-left-radius: 6px;
    }

    .chat-message .msg-time {
      font-size: 0.65rem;
      opacity: 0.75;
      display: block;
      margin-top: 6px;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--gray-100);
    }

    .chat-input-area input {
      flex: 1;
      padding: 13px 18px;
      border: 1.5px solid var(--gray-200);
      border-radius: 48px;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
      background: var(--gray-50);
    }

    .chat-input-area input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(10, 75, 122, 0.08);
    }

    /* CUSTOM ALERT */
    .custom-alert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 3000;
      animation: fadeIn 0.25s ease;
    }

    .custom-alert-overlay.active { display: flex; }

    .custom-alert-box {
      background: white;
      border-radius: var(--radius-xl);
      max-width: 420px;
      width: 90%;
      padding: 2rem 2rem 1.5rem;
      animation: slideUp 0.3s ease;
      text-align: center;
    }

    .custom-alert-box .alert-icon { font-size: 3rem; margin-bottom: 1rem; }
    .custom-alert-box .alert-icon.success { color: var(--success); }
    .custom-alert-box .alert-icon.error { color: var(--danger); }
    .custom-alert-box .alert-icon.warning { color: var(--warning); }
    .custom-alert-box .alert-icon.info { color: var(--info); }

    .custom-alert-box .alert-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 0.5rem;
    }

    .custom-alert-box .alert-message {
      color: var(--gray-600);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .custom-alert-box .alert-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .custom-alert-box .alert-buttons .btn { min-width: 90px; justify-content: center; }

    .loading-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--gray-400);
    }

    .empty-state i {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .empty-state p { font-size: 0.9rem; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .page-container { padding: 1rem; }
      header { padding: 1rem; }
      .nav-buttons { width: 100%; justify-content: flex-start; }
      .nav-buttons .btn span { display: none; }
      .student-list { grid-template-columns: 1fr; }
      .chat-modal .modal-container { max-width: 95%; }
      .tab-container { width: 100%; }
      .tab-btn { flex: 1; justify-content: center; }
      .inquiry-item .inquiry-message,
      .inquiry-item .inquiry-actions { padding-left: 0; }
      .latest-reply { margin-left: 0; }
    }

    @media (max-width: 480px) {
      .card { padding: 1.2rem; }
      .modal-body { padding: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="page-container">

  <!-- Header -->
  <header>
    <div class="logo-area">
      <img src="https://wxyzofficial.sirv.com/USC-Election/ssu.jpg" alt="SSU Logo">
      <div>
        <strong>SSU PWD Support System</strong><br>
        <small>Inquiries & Messages</small>
      </div>
    </div>
    <div class="nav-buttons">
      <span id="adminEmail" style="color: var(--gray-500); font-size: 0.8rem; margin-right: 0.5rem;"></span>
      <a href="admin.html" class="btn btn-outline"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
    </div>
  </header>

  <!-- Back to Dashboard -->
  <a href="admin.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

  <!-- Main Content -->
  <div class="card">
    <h3><i class="fas fa-comments"></i> Inquiries & Messages</h3>

    <!-- Tabs -->
    <div class="tab-container">
      <button class="tab-btn active" data-tab="inquiries" onclick="switchTab('inquiries')">
        <i class="fas fa-question-circle"></i> Inquiries <span id="inquiryCount" class="badge-count">0</span>
      </button>
      <button class="tab-btn" data-tab="messages" onclick="switchTab('messages')">
        <i class="fas fa-envelope"></i> Conversations <span id="messageCount" class="badge-count">0</span>
      </button>
    </div>

    <!-- Inquiries Tab -->
    <div id="inquiriesTab" class="tab-content active">
      <div id="inquiriesList"></div>
    </div>

    <!-- Messages/Conversations Tab -->
    <div id="messagesTab" class="tab-content">
      <p style="color: var(--gray-500); margin-bottom: 1.2rem; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-info-circle" style="color: var(--primary);"></i> 
        Click on a student to view and reply to their messages
      </p>
      <div id="studentConversationsList" class="student-list">
        <div style="text-align:center;padding:3rem;color:var(--gray-400);grid-column:1/-1;">
          <div class="loading-spinner"></div>
          <p style="margin-top:1rem;">Loading students...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Chat Modal -->
<div id="chatModal" class="modal-overlay chat-modal">
  <div class="modal-container">
    <div class="modal-header">
      <h3><i class="fas fa-comment-dots"></i> Conversation</h3>
      <button class="modal-close" onclick="closeChatModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;max-height:70vh;">
      <div class="chat-header">
        <div class="avatar" id="chatAvatar">S</div>
        <div>
          <div class="chat-user" id="chatUserName">Student</div>
          <div class="chat-status" id="chatUserStatus">Active</div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div style="text-align:center;padding:2rem;color:var(--gray-400);"><div class="loading-spinner"></div><p style="margin-top:1rem;">Loading messages...</p></div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
        <button class="btn btn-primary" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i> Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Reply Inquiry Modal -->
<div id="replyInquiryModal" class="modal-overlay">
  <div class="modal-container" style="max-width: 520px;">
    <div class="modal-header">
      <h3><i class="fas fa-reply"></i> Reply to Inquiry</h3>
      <button class="modal-close" onclick="closeReplyInquiryModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label><i class="fas fa-user"></i> From</label>
        <input type="text" id="replyInquirySender" class="modal-input" disabled>
      </div>
      <div class="form-group">
        <label><i class="fas fa-quote-left"></i> Original Message</label>
        <textarea id="replyInquiryOriginal" class="modal-textarea" disabled style="background:var(--gray-50);"></textarea>
      </div>
      <div class="form-group">
        <label><i class="fas fa-reply"></i> Your Reply</label>
        <textarea id="replyInquiryContent" class="modal-textarea" placeholder="Type your reply here..." rows="4"></textarea>
      </div>
      <div class="form-group">
        <label><i class="fas fa-tasks"></i> Update Status</label>
        <select id="replyInquiryStatus" class="modal-input">
          <option value="pending">⏳ Pending</option>
          <option value="ongoing">🔄 On-going</option>
          <option value="done">✅ Done</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeReplyInquiryModal()"><i class="fas fa-times"></i> Cancel</button>
      <button class="btn btn-primary" id="sendReplyInquiryBtn"><i class="fas fa-reply"></i> Send Reply</button>
    </div>
  </div>
</div>

<!-- Custom Alert -->
<div id="customAlert" class="custom-alert-overlay">
  <div class="custom-alert-box">
    <div class="alert-icon" id="alertIcon"><i class="fas fa-info-circle"></i></div>
    <div class="alert-title" id="alertTitle">Alert</div>
    <div class="alert-message" id="alertMessage">Message goes here</div>
    <div class="alert-buttons" id="alertButtons">
      <button class="btn btn-primary" onclick="closeCustomAlert()"><i class="fas fa-check"></i> OK</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD2Dk1HkuV-HT6Ew32BDYNmNmGDU6SMZiU",
    authDomain: "pwd-websystem.firebaseapp.com",
    projectId: "pwd-websystem",
    storageBucket: "pwd-websystem.firebasestorage.app",
    messagingSenderId: "249152340011",
    appId: "1:249152340011:web:1dd994b57a0f878be46a6e"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentAdmin = null;
  let selectedUserId = null;
  let selectedUserName = null;
  let selectedInquiryId = null;
  let chatUnsubscribe = null;

  // ==========================================
  // CUSTOM ALERT
  // ==========================================
  function showCustomAlert(title, message, type = 'info', confirmText = 'OK', onConfirm = null) {
    const overlay = document.getElementById('customAlert');
    const icon = document.getElementById('alertIcon');
    const titleEl = document.getElementById('alertTitle');
    const msgEl = document.getElementById('alertMessage');
    const buttons = document.getElementById('alertButtons');

    icon.className = 'alert-icon ' + type;
    const icons = {
      success: 'fa-check-circle',
      error: 'fa-times-circle',
      warning: 'fa-exclamation-triangle',
      info: 'fa-info-circle'
    };
    icon.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i>`;

    titleEl.textContent = title;
    msgEl.textContent = message;

    buttons.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = `btn btn-${type === 'error' ? 'danger' : type === 'warning' ? 'warning' : 'primary'}`;
    btn.innerHTML = `<i class="fas fa-check"></i> ${confirmText}`;
    btn.onclick = () => {
      closeCustomAlert();
      if (onConfirm) onConfirm();
    };
    buttons.appendChild(btn);

    overlay.classList.add('active');
  }

  function showCustomConfirm(title, message, onConfirm, onCancel = null) {
    const overlay = document.getElementById('customAlert');
    const icon = document.getElementById('alertIcon');
    const titleEl = document.getElementById('alertTitle');
    const msgEl = document.getElementById('alertMessage');
    const buttons = document.getElementById('alertButtons');

    icon.className = 'alert-icon warning';
    icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
    titleEl.textContent = title;
    msgEl.innerHTML = message;

    buttons.innerHTML = '';
    
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-outline';
    cancelBtn.innerHTML = '<i class="fas fa-times"></i> Cancel';
    cancelBtn.onclick = () => {
      closeCustomAlert();
      if (onCancel) onCancel();
    };
    buttons.appendChild(cancelBtn);

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn btn-danger';
    confirmBtn.innerHTML = '<i class="fas fa-check"></i> Confirm';
    confirmBtn.onclick = () => {
      closeCustomAlert();
      if (onConfirm) onConfirm();
    };
    buttons.appendChild(confirmBtn);

    overlay.classList.add('active');
  }

  function closeCustomAlert() {
    document.getElementById('customAlert').classList.remove('active');
  }

  // ==========================================
  // TAB SWITCHING
  // ==========================================
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    
    document.getElementById('inquiriesTab').classList.toggle('active', tab === 'inquiries');
    document.getElementById('messagesTab').classList.toggle('active', tab === 'messages');
    
    if (tab === 'messages') {
      loadStudentConversations();
    }
  }

  // ==========================================
  // CHAT MODAL
  // ==========================================
  function openChatModal(userId, userName) {
    selectedUserId = userId;
    selectedUserName = userName;
    
    document.getElementById('chatAvatar').textContent = (userName || 'S').charAt(0).toUpperCase();
    document.getElementById('chatUserName').textContent = userName || 'Student';
    document.getElementById('chatInput').value = '';
    document.getElementById('chatModal').classList.add('active');
    
    loadChatMessages(userId);
  }

  function closeChatModal() {
    document.getElementById('chatModal').classList.remove('active');
    if (chatUnsubscribe) {
      chatUnsubscribe();
      chatUnsubscribe = null;
    }
  }

  function loadChatMessages(userId) {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--gray-400);"><div class="loading-spinner"></div><p style="margin-top:1rem;">Loading messages...</p></div>';
    
    if (chatUnsubscribe) chatUnsubscribe();
    
    chatUnsubscribe = db.collection('messages')
      .where('userId', '==', userId)
      .orderBy('timestamp', 'asc')
      .onSnapshot(snap => {
        let html = '';
        if (snap.empty) {
          html = '<div style="text-align:center;padding:2rem;color:var(--gray-400);"><i class="fas fa-comment" style="font-size:2rem;display:block;margin-bottom:1rem;opacity:0.4;"></i>No messages yet. Start a conversation!</div>';
        } else {
          snap.forEach(doc => {
            const msg = doc.data();
            const date = msg.timestamp?.toDate?.() || new Date();
            const isAdmin = msg.role === 'admin' || msg.sender === 'Admin';
            html += `<div class="chat-message ${isAdmin ? 'sent' : 'received'}">
              ${msg.text || msg.message || ''}
              <span class="msg-time">${date.toLocaleString()}</span>
            </div>`;
          });
        }
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
      });
  }

  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message || !selectedUserId) return;
    
    input.value = '';
    
    try {
      await db.collection('messages').add({
        userId: selectedUserId,
        sender: 'Admin',
        text: message,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        role: 'admin',
        read: false
      });
      
      await db.collection('notifications').add({
        userId: selectedUserId,
        title: 'New Message from Admin',
        body: message.substring(0, 150) + (message.length > 150 ? '...' : ''),
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        type: 'admin_message'
      });
      
    } catch (error) {
      showCustomAlert('Error', 'Failed to send message: ' + error.message, 'error');
    }
  }

  // ==========================================
  // LOAD STUDENT CONVERSATIONS
  // ==========================================
  function loadStudentConversations() {
    const container = document.getElementById('studentConversationsList');
    container.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--gray-400);grid-column:1/-1;"><div class="loading-spinner"></div><p style="margin-top:1rem;">Loading students...</p></div>';
    
    db.collection('users').where('role', '==', 'student').orderBy('createdAt', 'desc').onSnapshot(snap => {
      let html = '';
      let count = 0;
      
      if (snap.empty) {
        html = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-user-graduate"></i><p>No students registered</p></div>';
      } else {
        snap.forEach(doc => {
          const student = doc.data();
          const userId = doc.id;
          const initial = (student.name || 'S').charAt(0).toUpperCase();
          count++;
          
          db.collection('messages')
            .where('userId', '==', userId)
            .orderBy('timestamp', 'desc')
            .limit(1)
            .get()
            .then(msgSnap => {
              let lastMsg = 'No messages yet';
              let hasUnread = false;
              if (!msgSnap.empty) {
                const msg = msgSnap.docs[0].data();
                lastMsg = msg.text || msg.message || '';
                hasUnread = msg.role !== 'admin' && !msg.read;
              }
              
              const cardEl = document.getElementById(`student_card_${userId}`);
              if (cardEl) {
                const msgEl = cardEl.querySelector('.last-message');
                if (msgEl) msgEl.textContent = lastMsg.substring(0, 60) + (lastMsg.length > 60 ? '...' : '');
                const badgeEl = cardEl.querySelector('.badge-unread');
                if (badgeEl) {
                  badgeEl.style.display = hasUnread ? 'inline-block' : 'none';
                }
              }
            });
          
          html += `
            <div class="student-card" id="student_card_${userId}" onclick="openChatModal('${userId}', '${student.name || 'Student'}')">
              <div class="avatar">${initial}</div>
              <div class="info">
                <div class="name">${student.name || 'Student'}</div>
                <div class="email">${student.email || ''}</div>
                <div class="last-message">Loading...</div>
              </div>
              <span class="badge-unread" style="display:none;">New</span>
            </div>
          `;
        });
      }
      
      container.innerHTML = html;
      document.getElementById('messageCount').textContent = count;
    });
  }

  // ==========================================
  // LOAD INQUIRIES
  // ==========================================
  function loadInquiries() {
    db.collection('inquiries').orderBy('timestamp', 'desc').onSnapshot(snap => {
      let html = '';
      let count = 0;
      
      if (snap.empty) {
        html = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No inquiries yet</p></div>';
      } else {
        snap.forEach(doc => {
          const inq = doc.data();
          count++;
          const date = inq.timestamp?.toDate?.() || new Date();
          const statusClass = `inquiry-${inq.status || 'pending'}`;
          const statusLabel = (inq.status || 'pending').toUpperCase();
          const replyCount = inq.replies ? inq.replies.length : 0;
          const initial = (inq.sender || 'S').charAt(0).toUpperCase();
          
          let statusIcon = 'fa-clock';
          if (inq.status === 'done') statusIcon = 'fa-check-circle';
          else if (inq.status === 'ongoing') statusIcon = 'fa-spinner';
          
          html += `<div class="inquiry-item">
            <div class="inquiry-header">
              <span class="inquiry-sender">
                <span class="sender-avatar">${initial}</span>
                ${inq.sender || 'Student'}
              </span>
              <span class="inquiry-date"><i class="fas fa-clock"></i> ${date.toLocaleString()}</span>
            </div>
            <div class="inquiry-message"><i class="fas fa-quote-left" style="color:var(--gray-300);margin-right:6px;"></i>${inq.message || ''}</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:40px;">
              <span class="inquiry-status ${statusClass}"><i class="fas ${statusIcon}"></i> ${statusLabel}</span>
              <span style="font-size:0.75rem;color:var(--gray-400);"><i class="fas fa-reply"></i> ${replyCount} ${replyCount === 1 ? 'reply' : 'replies'}</span>
            </div>
            <div class="inquiry-actions">
              <button class="btn btn-sm btn-primary" onclick="showReplyInquiryModal('${doc.id}', '${inq.sender}', '${inq.message}', '${inq.status || 'pending'}')"><i class="fas fa-reply"></i> Reply</button>
              ${inq.status !== 'done' ? `<button class="btn btn-sm btn-success" onclick="markInquiryDone('${doc.id}')"><i class="fas fa-check"></i> Mark Done</button>` : ''}
              <button class="btn btn-sm btn-danger" onclick="deleteInquiry('${doc.id}')"><i class="fas fa-trash-alt"></i></button>
            </div>
            ${replyCount > 0 ? `<div class="latest-reply">
              <strong><i class="fas fa-reply-all"></i> Latest Reply</strong>
              ${inq.replies[inq.replies.length - 1].message}
              <br><small>${new Date(inq.replies[inq.replies.length - 1].timestamp).toLocaleString()}</small>
            </div>` : ''}
          </div>`;
        });
      }
      
      document.getElementById('inquiriesList').innerHTML = html;
      document.getElementById('inquiryCount').textContent = count;
    });
  }

  // ==========================================
  // INQUIRY REPLY MODAL
  // ==========================================
  function showReplyInquiryModal(inquiryId, sender, message, currentStatus) {
    selectedInquiryId = inquiryId;
    document.getElementById('replyInquirySender').value = sender || 'Student';
    document.getElementById('replyInquiryOriginal').value = message || '';
    document.getElementById('replyInquiryContent').value = '';
    document.getElementById('replyInquiryStatus').value = currentStatus || 'pending';
    document.getElementById('replyInquiryModal').classList.add('active');
  }

  function closeReplyInquiryModal() {
    document.getElementById('replyInquiryModal').classList.remove('active');
  }

  document.getElementById('sendReplyInquiryBtn').onclick = async () => {
    const reply = document.getElementById('replyInquiryContent').value.trim();
    const newStatus = document.getElementById('replyInquiryStatus').value;
    
    if (!reply) {
      showCustomAlert('Message Required', 'Please enter a reply message.', 'warning');
      return;
    }
    
    const sendBtn = document.getElementById('sendReplyInquiryBtn');
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    
    try {
      const inquiryRef = db.collection('inquiries').doc(selectedInquiryId);
      const inquiryDoc = await inquiryRef.get();
      
      if (!inquiryDoc.exists) {
        showCustomAlert('Error', 'Inquiry not found.', 'error');
        return;
      }
      
      const data = inquiryDoc.data();
      const replies = data.replies || [];
      
      replies.push({
        from: 'Admin',
        message: reply,
        timestamp: new Date().toISOString()
      });
      
      await inquiryRef.update({
        status: newStatus,
        replies: replies,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastReplyAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      await db.collection('notifications').add({
        userId: data.userId || 'all',
        title: 'New Reply to Your Inquiry',
        body: `Admin replied to your inquiry: "${reply.substring(0, 80)}${reply.length > 80 ? '...' : ''}"`,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        type: 'inquiry_reply'
      });
      
      showCustomAlert('Success', 'Reply sent successfully!', 'success');
      closeReplyInquiryModal();
    } catch (error) {
      showCustomAlert('Error', 'Error sending reply: ' + error.message, 'error');
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fas fa-reply"></i> Send Reply';
    }
  };

  // ==========================================
  // INQUIRY ACTIONS
  // ==========================================
  window.markInquiryDone = (inquiryId) => {
    showCustomConfirm(
      'Mark as Done',
      'Mark this inquiry as <strong>Done</strong>?<br><br><span style="color:var(--gray-500);font-size:0.85rem;">The student will be notified.</span>',
      async () => {
        await db.collection('inquiries').doc(inquiryId).update({
          status: 'done',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        const inquiryDoc = await db.collection('inquiries').doc(inquiryId).get();
        if (inquiryDoc.exists) {
          const data = inquiryDoc.data();
          await db.collection('notifications').add({
            userId: data.userId || 'all',
            title: 'Inquiry Resolved',
            body: `Your inquiry "${data.message?.substring(0, 50)}..." has been marked as resolved.`,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'inquiry_update'
          });
        }
        showCustomAlert('Success', 'Inquiry marked as done!', 'success');
      }
    );
  };

  window.deleteInquiry = (inquiryId) => {
    showCustomConfirm(
      'Delete Inquiry',
      'Delete this inquiry?<br><br><span style="color:var(--danger);"><i class="fas fa-exclamation-circle"></i> This cannot be undone!</span>',
      async () => {
        try {
          await db.collection('inquiries').doc(inquiryId).delete();
          showCustomAlert('Success', 'Inquiry deleted successfully!', 'success');
        } catch (error) {
          showCustomAlert('Error', 'Error deleting inquiry: ' + error.message, 'error');
        }
      }
    );
  };

  // ==========================================
  // AUTH CHECK
  // ==========================================
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = 'index.html';
      return;
    }

    const userDoc = await db.collection('users').doc(user.uid).get();
    if (!userDoc.exists || userDoc.data().role !== 'admin') {
      showCustomAlert('Access Denied', 'Admin privileges required!', 'error');
      await auth.signOut();
      window.location.href = 'index.html';
      return;
    }

    currentAdmin = { uid: user.uid, email: user.email, ...userDoc.data() };
    document.getElementById('adminEmail').innerText = user.email;
    
    loadInquiries();
    loadStudentConversations();
  });

  // ==========================================
  // LOGOUT
  // ==========================================
  document.getElementById('logoutBtn').onclick = () => {
    showCustomConfirm(
      'Logout',
      'Logout from inquiries page?',
      async () => {
        await db.collection('auditLogs').add({
          action: 'admin_logout',
          adminId: currentAdmin?.uid,
          adminEmail: currentAdmin?.email,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        await auth.signOut();
        window.location.href = 'index.html';
      }
    );
  };

  // Close modals on escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeChatModal();
      closeReplyInquiryModal();
      closeCustomAlert();
    }
  });

  // Close chat modal when clicking overlay
  document.getElementById('chatModal').addEventListener('click', function(e) {
    if (e.target === this) closeChatModal();
  });

  // Close reply modal when clicking overlay
  document.getElementById('replyInquiryModal').addEventListener('click', function(e) {
    if (e.target === this) closeReplyInquiryModal();
  });
</script>

</body>
</html>
